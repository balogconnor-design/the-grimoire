<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · The Grimoire</title>
  <!-- Cloudflare Pages serves this for any missing file. Its existence also turns off Pages'
       single-page-app fallback, so a missing /assets/ file returns 404 instead of index.html
       (which browsers, the service worker and Cloudflare's cache would otherwise keep as the file). -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1218; color: #e6e9ef; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
    a { color: #6ea8ff; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Open The Grimoire</a></p>
  </main>
</body>
</html>
