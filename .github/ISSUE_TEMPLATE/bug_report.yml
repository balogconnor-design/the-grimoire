name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't attach a backup file; it contains your whole collection.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Opened a deck
        2. Tapped Export
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Which version of the app?
      options:
        - Website (the-grimoire.app) in a browser tab
        - Website, installed as an app
        - Portable app (The Grimoire.exe)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows 11, Edge
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the top of Help & about (the ? button).
      placeholder: e.g. 0.8.1.0
